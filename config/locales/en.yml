    legend_key: "Gemini API key (shared across Previo)"
    legend_general: "General settings"
    legend_reply: "Reply suggestion (button next to the comment field)"
    reply_note: "Settings for the \"AI reply suggestion\" button under the comment field. All public comments plus the issue subject and description are always included."
    legend_summary: "Issue summary (the \"AI Summarizer\" button)"
    summary_note: "Settings for the \"AI Summarizer\" button in the issue action bar. The summary is only displayed in a window above the issue — it is never inserted anywhere."
    legend_draft: "New issue pre-fill (the \"Create with AI\" button)"
    draft_note: "Settings for the button on the new issue form. From a short note the AI fills in the subject, description, tracker, category, priority and required fields (e.g. Project Manager). The form is only PRE-FILLED — \"Create\" is always clicked by a human. No list of projects, categories or PMs is maintained anywhere, and neither are the description templates: they are read from Redmine."

    setting_api_key: "Gemini API key"
    setting_api_key_info: "Only an administrator sets this key and it applies to every user. It is stored encrypted and never sent to the browser, so it cannot be read via Inspect element. Leave the field empty to keep the existing key. Get a key at aistudio.google.com."
    setting_api_key_clear: "Remove key"
    setting_api_key_clear_info: "Tick and save to delete the stored key."
    key_set: "Key is set (%{hint})"
    key_missing: "No key set — the AI assistant will not work."

    setting_enabled: "Enable the AI assistant"
    setting_enabled_info: "Off is the safe default — nothing is sent to Gemini until this is enabled."
    setting_model: "Model"
    setting_model_info: "For example gemini-3.6-flash (recommended default) or gemini-3.5-flash-lite for lower cost."
    setting_max_tokens: "Max response tokens"
    setting_max_tokens_info: "On reasoning models the limit is shared between thinking and the answer — a low value can yield an empty reply. Below 1024 is not recommended."
    setting_rate_limit: "Calls per user per hour"
    setting_rate_limit_info: "0 = unlimited. Calls are billed to the shared key, so this limit protects Previo's budget."
    setting_description_limit: "Max description characters"
    setting_description_limit_info: "Applies to the reply suggestion only — there the gist of the request is enough. The summary has its own limit below."
    setting_changeset_limit: "Commits included in the context"
    setting_changeset_limit_info: "Native changesets from the issue's repository. Skipped when the project has none."
    setting_system_prompt: "System prompt for the reply suggestion"
    setting_system_prompt_info: "The persona that writes comment replies — who it is, how it writes and in which language. {{NAME}} is replaced with the signed-in user's name. An empty field restores the original text."
    setting_summary_description_limit: "Max description characters for the summary"
    setting_summary_description_limit_info: "For a summary the description carries the actual request, so the limit is higher (default 4000). 0 = no truncation at all."
    setting_summary_system_prompt: "System prompt for the summary"
    setting_summary_system_prompt_info: "A separate persona and, above all, the SHAPE of the summary (sections, length, language) — deliberately here rather than in the code, so it can be rewritten without touching the plugin. {{NAME}} is replaced with the signed-in user's name. An empty field restores the original text."
    setting_draft_enabled: "Enable new issue pre-fill"
    setting_draft_enabled_info: "A separate switch, so this feature can be rolled out and turned off independently of reply drafts and summaries. It also needs the main AI assistant switch above."
    setting_draft_similar_limit: "Issues checked for duplicates"
    setting_draft_similar_limit_info: "How many existing open issues of the project are offered to the model for review. Redmine's search sorts by date rather than relevance, so a larger batch is taken and the model re-ranks it. 0 = do not look for duplicates."
    setting_draft_translate_keywords: "Translate keywords for duplicate search"
    setting_draft_translate_keywords_info: "Issue subjects are written in English, but people write their note in their own language (colleagues are in Romania, Poland and Hungary). Duplicate search is a plain LIKE over subjects, so a Czech note found 5 issues in Reservations and none of them was related, while the same note in English hit the cap of 40 with relevant matches on top. With this on, a small extra call first turns the note into English keywords. If it fails, the search falls back to the original wording — the draft itself is never affected.
      Note: one click then means up to three paid calls (keywords, draft, and a second draft if the AI changes the project), but only one is counted against the hourly limit. The translation is cached separately, so clicking again on the same note does not pay for it twice."
    setting_draft_max_tokens: "Max. tokens for the issue draft"
    setting_draft_max_tokens_info: "A separate, higher limit than for replies — a templated description plus reasons for duplicates is a longer output. Too low a value returns truncated JSON and the draft fails."
    legend_plan: "Plan mode (wand in the header, \"AI issue creator\")"
    plan_note: "Settings for the wand icon next to the person icon in the header. You describe the work in your own words and your own language, the AI proposes a plan — one issue, or a parent issue with subtasks — and the plan can be refined in conversation. After \"Accept\" the issues are pre-filled ONE AT A TIME and a human clicks \"Create\" for each of them. The order is forced by Redmine: a subtask needs the id of its parent, which only exists once the parent has been created."
    button_plan: "AI issue creator"
    plan_shortcut_hint: "AI issue creator (%{keys})"
    setting_plan_enabled: "Enable plan mode"
    setting_plan_enabled_info: "A separate switch, so this feature can be rolled out and turned off independently of the others. It also needs the main AI assistant switch above. While it is off, the wand icon is not shown in the header."
    setting_plan_max_items: "Max. issues per plan"
    setting_plan_max_items_info: "Including the parent issue. Six is chosen from the output, not from ambition: every item carries its own description, and a plan nobody reads through is useless anyway. The hard cap in code is 12 regardless of this value."
    setting_plan_max_tokens: "Max. tokens for the plan"
    setting_plan_max_tokens_info: "Higher than the limit for a single issue — a plan carries a description for every item. Too low a value returns truncated JSON and the plan fails."
    setting_plan_system_prompt: "System prompt for plan mode"
    setting_plan_system_prompt_info: "Rules for splitting work into issues: when to use a parent issue and when not to, that subject and description are always in English, and that the plan summary is instead in the language of the request. Do NOT put lists of projects, categories or PMs, or description templates, in here — they are added from Redmine. {{NAME}} is replaced with the logged-in user name. An empty field restores the original text."
    error_plan_empty: "Describe what needs to be done first."
    plan_input_label: "What needs to be done?"
    plan_input_placeholder: "Describe it in your own words and your own language. If it takes more than one issue, the AI will propose how to lay them out."
    plan_project_lock: "Keep this project"
    plan_submit: "See AI suggestion"
    plan_refine: "Recalculate with my notes"
    plan_accept: "Accept"
    plan_working: "Preparing the plan…"
    plan_heading: "Proposed plan"
    plan_parent: "Parent issue"
    plan_subtask: "Subtask"
    plan_standalone: "Standalone issue"
    plan_no_subtasks: "You cannot manage subtasks in %{project}, so the AI will propose standalone issues. The recommended order is in the summary."
    error_plan_no_result: "The AI returned no issue. Try adding more detail."
    plan_queue_progress: "AI plan: %{done} of %{total} created"
    plan_queue_next: "Next: %{subject}"
    plan_queue_go: "Pre-fill the next issue"
    plan_queue_skip: "Skip"
    plan_queue_cancel: "Cancel plan"
    plan_queue_dismiss: "Dismiss"
    plan_queue_done: "Done — the plan has been created."
    plan_queue_no_parent: "The parent issue was not created, so the remaining issues will be standalone."
    plan_queue_parent_missing: "Redmine did not render the parent issue field — you lack the permission in this project, so this issue will be standalone."
    setting_draft_system_prompt: "System prompt for the issue pre-fill"
    setting_draft_system_prompt_info: "The persona and the rules for writing issues — among them that the subject and description are ALWAYS in English, and how the tracker is chosen. Do NOT put lists of projects, categories or PMs here, nor the description templates: they are added automatically from Redmine. {{NAME}} is replaced with the signed-in user's name. An empty field restores the original text."

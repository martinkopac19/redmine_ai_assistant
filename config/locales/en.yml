en:
  ai_assistant:
    working: "Generating…"
    cancel: "Cancel generating"
    button_suggest: "AI reply suggestion"
    button_summary: "AI Summarizer"
    summary_working: "Generating the summary…"
    summary_title: "Summary of issue %{issue}"
    close: "Close"

    error_disabled: "The AI assistant is disabled in the administration."
    error_no_key: "The administrator has not set a Gemini API key yet."
    error_invalid_key: "Gemini rejected the API key — ask an admin to check it in the plugin configuration."
    error_unavailable: "The AI assistant is not available for this issue."
    error_rate_limited: "You hit the hourly AI call limit. Try again later."
    error_provider_rate_limited: "Gemini reports a rate limit or exhausted quota. Try again shortly."
    error_blocked: "Gemini blocked the request with its safety filters."
    error_truncated: "The reply did not fit the token limit — ask an admin to raise 'Max response tokens'."
    error_timeout: "Gemini did not respond in time."
    error_unreachable: "Could not reach Gemini — check the network."
    error_generic: "The AI call failed; see the server log for details."

    legend_key: "Gemini API key (shared across Previo)"
    legend_general: "General settings"
    legend_reply: "Reply suggestion (button next to the comment field)"
    reply_note: "Settings for the \"AI reply suggestion\" button under the comment field. All public comments plus the issue subject and description are always included."
    legend_summary: "Issue summary (the \"AI Summarizer\" button)"
    summary_note: "Settings for the \"AI Summarizer\" button in the issue action bar. The summary is only displayed in a window above the issue — it is never inserted anywhere."

    setting_api_key: "Gemini API key"
    setting_api_key_info: "Only an administrator sets this key and it applies to every user. It is stored encrypted and never sent to the browser, so it cannot be read via Inspect element. Leave the field empty to keep the existing key. Get a key at aistudio.google.com."
    setting_api_key_clear: "Remove key"
    setting_api_key_clear_info: "Tick and save to delete the stored key."
    key_set: "Key is set (%{hint})"
    key_missing: "No key set — the AI assistant will not work."

    setting_enabled: "Enable the AI assistant"
    setting_enabled_info: "Off is the safe default — nothing is sent to Gemini until this is enabled."
    setting_model: "Model"
    setting_model_info: "For example gemini-3.6-flash (recommended default) or gemini-3.5-flash-lite for lower cost."
    setting_max_tokens: "Max response tokens"
    setting_max_tokens_info: "On reasoning models the limit is shared between thinking and the answer — a low value can yield an empty reply. Below 1024 is not recommended."
    setting_rate_limit: "Calls per user per hour"
    setting_rate_limit_info: "0 = unlimited. Calls are billed to the shared key, so this limit protects Previo's budget."
    setting_description_limit: "Max description characters"
    setting_description_limit_info: "Applies to the reply suggestion only — there the gist of the request is enough. The summary has its own limit below."
    setting_changeset_limit: "Commits included in the context"
    setting_changeset_limit_info: "Native changesets from the issue's repository. Skipped when the project has none."
    setting_system_prompt: "System prompt for the reply suggestion"
    setting_system_prompt_info: "The persona that writes comment replies — who it is, how it writes and in which language. {{NAME}} is replaced with the signed-in user's name. An empty field restores the original text."
    setting_summary_description_limit: "Max description characters for the summary"
    setting_summary_description_limit_info: "For a summary the description carries the actual request, so the limit is higher (default 4000). 0 = no truncation at all."
    setting_summary_system_prompt: "System prompt for the summary"
    setting_summary_system_prompt_info: "A separate persona and, above all, the SHAPE of the summary (sections, length, language) — deliberately here rather than in the code, so it can be rewritten without touching the plugin. {{NAME}} is replaced with the signed-in user's name. An empty field restores the original text."

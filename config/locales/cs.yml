    legend_key: "Gemini API klíč (společný pro celé Previo)"
    legend_general: "Základní nastavení"
    legend_reply: "Návrh odpovědi (tlačítko u komentáře)"
    reply_note: "Nastavení pro tlačítko „AI návrh odpovědi\" pod polem komentáře. Do kontextu jdou automaticky všechny veřejné komentáře, název a popis úkolu."
    legend_summary: "Shrnutí úkolu (tlačítko „AI Summarizer\")"
    summary_note: "Nastavení pro tlačítko „AI Summarizer\" v liště akcí úkolu. Shrnutí se pouze zobrazí v okně nad úkolem — nikam se nevkládá."
    legend_draft: "Předvyplnění nového úkolu (tlačítko „Create with AI\")"
    draft_note: "Nastavení pro tlačítko na formuláři nového úkolu. AI z krátkého zadání doplní název, popis, tracker, kategorii, prioritu a povinná pole (např. Project Manager). Formulář se jen VYPLNÍ — „Create\" vždy kliká člověk. Seznam projektů, kategorií, PM ani šablony popisu se nikde neudržují: čtou se z Redmine."

    setting_api_key: "Gemini API klíč"
    setting_api_key_info: "Klíč zadává jen administrátor a platí pro všechny uživatele. Ukládá se zašifrovaně a do prohlížeče se nikdy neposílá, takže ho nelze přečíst ani přes Inspect element. Pole nechej prázdné, pokud chceš existující klíč ponechat. Klíč získáš na aistudio.google.com."
    setting_api_key_clear: "Smazat klíč"
    setting_api_key_clear_info: "Zaškrtni a ulož, pokud chceš uložený klíč odstranit."
    key_set: "Klíč je nastaven (%{hint})"
    key_missing: "Klíč není nastaven — AI asistent nebude fungovat."

    setting_enabled: "Zapnout AI asistenta"
    setting_enabled_info: "Vypnuto je bezpečný default — bez zapnutí se do Gemini neodešle nic."
    setting_model: "Model"
    setting_model_info: "Např. gemini-3.6-flash (doporučený default) nebo gemini-3.5-flash-lite pro nižší náklady."
    setting_max_tokens: "Max. tokenů odpovědi"
    setting_max_tokens_info: "U modelů s uvažováním se limit dělí mezi uvažování a odpověď — při nízké hodnotě může přijít prázdná odpověď. Méně než 1024 se nedoporučuje."
    setting_rate_limit: "Limit volání na uživatele za hodinu"
    setting_rate_limit_info: "0 = bez limitu. Platí se ze společného klíče, takže limit chrání rozpočet Previa."
    setting_description_limit: "Max. znaků popisu"
    setting_description_limit_info: "Platí jen pro návrh odpovědi — tam stačí zadání v hrubých obrysech. Shrnutí má vlastní limit níže."
    setting_changeset_limit: "Počet commitů v kontextu"
    setting_changeset_limit_info: "Nativní changesety z repozitáře úkolu. Pokud projekt repozitář nemá, sekce se vynechá."
    setting_system_prompt: "Systémový prompt pro návrh odpovědi"
    setting_system_prompt_info: "Persona, která píše odpovědi do komentářů — kdo je, jak píše a v jakém jazyce. {{NAME}} se nahradí jménem přihlášeného uživatele. Prázdné pole vrátí původní text."
    setting_summary_description_limit: "Max. znaků popisu pro shrnutí"
    setting_summary_description_limit_info: "U shrnutí nese zadání právě popis, proto je limit vyšší (default 4000). 0 = nezkracovat vůbec."
    setting_summary_system_prompt: "Systémový prompt pro shrnutí"
    setting_summary_system_prompt_info: "Samostatná persona a hlavně FORMA shrnutí (sekce, délka, jazyk) — je záměrně tady, ne v kódu, abys ji mohl přepsat bez zásahu do pluginu. {{NAME}} se nahradí jménem přihlášeného uživatele. Prázdné pole vrátí původní text."
    setting_draft_enabled: "Zapnout předvyplnění nového úkolu"
    setting_draft_enabled_info: "Vlastní vypínač, aby se tato funkce dala nasadit i vypnout odděleně od návrhu odpovědi a shrnutí. Vyžaduje i hlavní zapnutí AI asistenta výše."
    setting_draft_similar_limit: "Počet úkolů posuzovaných na duplicitu"
    setting_draft_similar_limit_info: "Kolik existujících otevřených úkolů projektu se modelu nabídne k posouzení. Vyhledávání v Redmine řadí podle data, ne relevance, proto se bere větší hrst a přeřadit ji necháme model. 0 = duplicity nehledat."
    setting_draft_translate_keywords: "Překládat klíčová slova pro hledání duplicit"
    setting_draft_translate_keywords_info: "Názvy úkolů jsou psané anglicky, ale zadání píše každý ve svém jazyce (kolegové jsou v Rumunsku, Polsku a Maďarsku). Hledání duplicit je obyčejné LIKE nad názvy, takže české zadání našlo v Reservations 5 úkolů a ani jeden nesouvisel, kým totéž anglicky narazilo na strop 40 a relevantní byly hned první. Se zapnutou volbou proběhne nejdřív malé volání, které zadání převede na anglická klíčová slova. Když selže, hledá se podle původního textu — na samotný návrh úkolu to nemá vliv.
      Pozn.: jedno kliknutí pak znamená až tři placená volání (klíčová slova, návrh a druhý návrh při změně projektu), z hodinového limitu se ale počítá jedno. Překlad se cachuje zvlášť, takže opakované kliknutí na totéž zadání ho neplatí dvakrát."
    setting_draft_max_tokens: "Max. tokenů návrhu úkolu"
    setting_draft_max_tokens_info: "Vlastní, vyšší limit než u odpovědi — popis podle šablony a důvody u duplicit jsou delší výstup. Při nízké hodnotě přijde odříznutý JSON a návrh selže."
    legend_plan: "Režim plánu (kouzelná hůlka v hlavičce, „AI issue creator\")"
    plan_note: "Nastavení pro ikonku hůlky vedle ikonky osoby v hlavičce. Úkol popíšeš vlastními slovy a ve svém jazyce, AI navrhne plán — jeden úkol nebo nadřazený úkol s podúkoly — a plán lze v konverzaci doupřesnit. Po „Accept\" se úkoly předvyplňují JEDEN PO DRUHÉM a „Create\" u každého klikne člověk. Pořadí je vynucené Redmine: podúkol potřebuje číslo nadřazeného úkolu, které vznikne až jeho založením."
    button_plan: "AI issue creator"
    setting_plan_enabled: "Zapnout režim plánu"
    setting_plan_enabled_info: "Vlastní vypínač, aby se tato funkce dala nasadit i vypnout odděleně od ostatních. Vyžaduje i hlavní zapnutí AI asistenta výše. Když je vypnutá, ikonka hůlky se v hlavičce nezobrazí."
    setting_plan_max_items: "Max. počet úkolů v plánu"
    setting_plan_max_items_info: "Včetně nadřazeného úkolu. Šest je zvoleno podle výstupu, ne podle ambice: každá položka nese vlastní popis a plán, který člověk neprojde očima, je tak jako tak zbytečný. Strop v kódu je 12 bez ohledu na tuto hodnotu."
    setting_plan_max_tokens: "Max. tokenů plánu"
    setting_plan_max_tokens_info: "Vyšší než limit pro jeden úkol — plán nese popis ke každé položce. Při nízké hodnotě přijde odříznutý JSON a plán selže."
    setting_plan_system_prompt: "Systémový prompt pro režim plánu"
    setting_plan_system_prompt_info: "Pravidla pro rozpad na úkoly: kdy nadřazený úkol použít a kdy ne, že název a popis jsou vždy v angličtině, a že souhrn plánu je naopak v jazyce zadání. Seznamy projektů, kategorií a PM ani šablony sem NEPIŠ — doplňují se z Redmine. {{NAME}} se nahradí jménem přihlášeného uživatele. Prázdné pole vrátí původní text."
    error_plan_empty: "Nejdřív popiš, co je potřeba udělat."
    plan_input_label: "Co je potřeba udělat?"
    plan_input_placeholder: "Popiš to vlastními slovy a ve svém jazyce. Pokud je to na víc úkolů, AI navrhne, jak je poskládat."

    setting_draft_system_prompt: "Systémový prompt pro předvyplnění úkolu"
    setting_draft_system_prompt_info: "Persona a pravidla pro psaní úkolů — mimo jiné to, že název a popis jsou VŽDY v angličtině, a podle čeho se vybírá tracker. Seznamy projektů, kategorií a PM ani šablony popisu sem NEPIŠ: doplňují se automaticky z Redmine. {{NAME}} se nahradí jménem přihlášeného uživatele. Prázdné pole vrátí původní text."

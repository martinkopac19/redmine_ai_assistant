    legend_key: "Gemini API kľúč (spoločný pre celé Previo)"
    legend_general: "Základné nastavenia"
    legend_reply: "Návrh odpovede (tlačidlo pri komentári)"
    reply_note: "Nastavenia pre tlačidlo „AI návrh odpovede\" pod poľom komentára. Do kontextu idú automaticky všetky verejné komentáre, názov a popis úlohy."
    legend_summary: "Zhrnutie úlohy (tlačidlo „AI Summarizer\")"
    summary_note: "Nastavenia pre tlačidlo „AI Summarizer\" v lište akcií úlohy. Zhrnutie sa iba zobrazí v okne nad úlohou — nikam sa nevkladá."
    legend_draft: "Predvyplnenie novej úlohy (tlačidlo „Create with AI\")"
    draft_note: "Nastavenia pre tlačidlo na formulári novej úlohy. AI z krátkeho zadania doplní názov, popis, tracker, kategóriu, prioritu a povinné polia (napr. Project Manager). Formulár sa len VYPLNÍ — „Create\" vždy klikne človek. Zoznam projektov, kategórií, PM ani šablóny popisu sa nikde neudržujú: čítajú sa z Redmine."

    setting_api_key: "Gemini API kľúč"
    setting_api_key_info: "Kľúč zadáva len administrátor a platí pre všetkých užívateľov. Ukladá sa šifrovane a do prehliadača sa nikdy neposiela, takže sa nedá prečítať ani cez Inspect element. Pole nechaj prázdne, ak chceš existujúci kľúč ponechať. Kľúč získaš na aistudio.google.com."
    setting_api_key_clear: "Zmazať kľúč"
    setting_api_key_clear_info: "Zaškrtni a ulož, ak chceš uložený kľúč odstrániť."
    key_set: "Kľúč je nastavený (%{hint})"
    key_missing: "Kľúč nie je nastavený — AI asistent nebude fungovať."

    setting_enabled: "Zapnúť AI asistenta"
    setting_enabled_info: "Vypnuté je bezpečný default — bez zapnutia sa do Gemini neodošle nič."
    setting_model: "Model"
    setting_model_info: "Napr. gemini-3.6-flash (odporúčaný default) alebo gemini-3.5-flash-lite pre nižšie náklady."
    setting_max_tokens: "Max. tokenov odpovede"
    setting_max_tokens_info: "U modelov s uvažovaním sa limit delí medzi uvažovanie a odpoveď — pri nízkej hodnote môže prísť prázdna odpoveď. Menej ako 1024 sa neodporúča."
    setting_rate_limit: "Limit volaní na užívateľa za hodinu"
    setting_rate_limit_info: "0 = bez limitu. Platí sa zo spoločného kľúča, takže limit chráni rozpočet Previa."
    setting_description_limit: "Max. znakov popisu"
    setting_description_limit_info: "Platí len pre návrh odpovede — tam stačí zadanie v hrubých obrysoch. Zhrnutie má vlastný limit nižšie."
    setting_changeset_limit: "Počet commitov v kontexte"
    setting_changeset_limit_info: "Natívne changesety z repozitára úlohy. Ak projekt repozitár nemá, sekcia sa vynechá."
    setting_system_prompt: "Systémový prompt pre návrh odpovede"
    setting_system_prompt_info: "Persona, ktorá píše odpovede do komentárov — kto je, ako píše a v akom jazyku. {{NAME}} sa nahradí menom prihláseného užívateľa. Prázdne pole vráti pôvodný text."
    setting_summary_description_limit: "Max. znakov popisu pre zhrnutie"
    setting_summary_description_limit_info: "Pri zhrnutí nesie zadanie práve popis, preto je limit vyšší (default 4000). 0 = neskracovať vôbec."
    setting_summary_system_prompt: "Systémový prompt pre zhrnutie"
    setting_summary_system_prompt_info: "Samostatná persona a hlavne FORMA zhrnutia (sekcie, dĺžka, jazyk) — je zámerne tu, nie v kóde, aby si ju mohol prepísať bez zásahu do pluginu. {{NAME}} sa nahradí menom prihláseného užívateľa. Prázdne pole vráti pôvodný text."
    setting_draft_enabled: "Zapnúť predvyplnenie novej úlohy"
    setting_draft_enabled_info: "Vlastný vypínač, aby sa táto funkcia dala nasadiť aj vypnúť oddelene od návrhu odpovede a zhrnutia. Vyžaduje aj hlavné zapnutie AI asistenta vyššie."
    setting_draft_similar_limit: "Počet úloh posudzovaných na duplicitu"
    setting_draft_similar_limit_info: "Koľko existujúcich otvorených úloh projektu sa modelu nabídne na posúdenie. Hľadanie v Redmine radí podľa dátumu, nie relevancie, preto sa berie väčšia hŕba a preradiť ju necháme model. 0 = duplicity nehľadať."
    setting_draft_translate_keywords: "Prekladať kľúčové slová pre hľadanie duplicít"
    setting_draft_translate_keywords_info: "Názvy úloh sú písané anglicky, ale zadanie píše každý vo svojom jazyku (kolegovia sú v Rumunsku, Poľsku a Maďarsku). Hľadanie duplicít je obyčajné LIKE nad názvami, takže české zadanie našlo v Reservations 5 úloh a ani jedna nesúvisela, kým to isté anglicky narazilo na strop 40 a relevantné boli hneď prvé. So zapnutou voľbou prebehne najprv malé volanie, ktoré zadanie prevedie na anglické kľúčové slová. Keď zlyhá, hľadá sa podľa pôvodného textu — na samotný návrh úlohy to nemá vplyv.
      Pozn.: jedno kliknutie potom znamená až tri platené volania (kľúčové slová, návrh a druhý návrh pri zmene projektu), z hodinového limitu sa však počíta jedno. Preklad sa cachuje zvlášť, takže opakované kliknutie na to isté zadanie ho neplatí dvakrát."
    setting_draft_max_tokens: "Max. tokenov návrhu úlohy"
    setting_draft_max_tokens_info: "Vlastný, vyšší limit než pri odpovedi — popis podľa šablóny a dôvody u duplicít sú dlhší výstup. Pri nízkej hodnote prijde odrezaný JSON a návrh zlyhá."
    legend_plan: "Režim plánu (prútik v hlavičke, „AI issue creator\")"
    plan_note: "Nastavenia pre ikonku prútika vedľa ikonky osoby v hlavičke. Úlohu opíšeš vlastnými slovami a vo svojom jazyku, AI navrhne plán — jednu úlohu alebo nadradenú úlohu s podúlohami — a plán sa dá v konverzácii doupresniť. Po „Accept\" sa úlohy predvypĺňajú JEDNA PO DRUHEJ a „Create\" pri každej klikne človek. Poradie je vynútené Redmine: podúloha potrebuje číslo nadradenej úlohy, ktoré vznikne až jej založením."
    button_plan: "AI issue creator"
    plan_shortcut_hint: "AI issue creator (%{keys})"
    setting_plan_enabled: "Zapnúť režim plánu"
    setting_plan_enabled_info: "Vlastný vypínač, aby sa táto funkcia dala nasadiť aj vypnúť oddelene od ostatných. Vyžaduje aj hlavné zapnutie AI asistenta vyššie. Keď je vypnutá, ikonka prútika sa v hlavičke nezobrazí."
    setting_plan_max_items: "Max. počet úloh v pláne"
    setting_plan_max_items_info: "Vrátane nadradenej úlohy. Šesť je zvolené podľa výstupu, nie podľa ambície: každá položka nesie vlastný popis a plán, ktorý človek neprejde očami, je aj tak zbytočný. Strop v kóde je 12 bez ohľadu na túto hodnotu."
    setting_plan_max_tokens: "Max. tokenov plánu"
    setting_plan_max_tokens_info: "Vyššie než limit pre jednu úlohu — plán nesie popis ku každej položke. Pri nízkej hodnote prijde odrezaný JSON a plán zlyhá."
    setting_plan_system_prompt: "Systémový prompt pre režim plánu"
    setting_plan_system_prompt_info: "Pravidlá pre rozpad na úlohy: kedy nadradenú úlohu použiť a kedy nie, že názov a popis sú vždy v angličtine, a že súhrn plánu je naopak v jazyku zadania. Zoznamy projektov, kategórií a PM ani šablóny sem NEPÍŠ — dopĺňajú sa z Redmine. {{NAME}} sa nahradí menom prihláseného užívateľa. Prázdne pole vráti pôvodný text."
    error_plan_empty: "Najprv opíš, čo treba urobiť."
    plan_input_label: "Čo treba urobiť?"
    plan_input_placeholder: "Opíš to vlastnými slovami a vo svojom jazyku. Ak je to na viac úloh, AI navrhne, ako ich poskladať."
    plan_project_lock: "Nemeniť projekt"
    plan_submit: "See AI suggestion"
    plan_refine: "Prepočítať s doplnením"
    plan_accept: "Accept"
    plan_working: "Pripravujem návrh plánu…"
    plan_heading: "Návrh plánu"
    plan_parent: "Nadradená úloha"
    plan_subtask: "Podúloha"
    plan_standalone: "Samostatná úloha"
    plan_no_subtasks: "V projekte %{project} nemáš právo spravovať podúlohy, takže AI navrhne samostatné úlohy. Doporučené poradie je v súhrne."
    error_plan_no_result: "AI nevrátila žiadnu úlohu. Skús zadanie doplniť."
    plan_queue_progress: "AI plán: založené %{done} zo %{total}"
    plan_queue_next: "Ďalšia: %{subject}"
    plan_queue_go: "Predvyplniť ďalšiu úlohu"
    plan_queue_skip: "Preskočiť"
    plan_queue_cancel: "Zrušiť plán"
    plan_queue_dismiss: "Skryť"
    plan_queue_done: "Hotovo — plán je založený."
    plan_queue_no_parent: "Nadradená úloha nebola založená, takže ďalšie úlohy vzniknú samostatne."
    plan_queue_parent_missing: "Redmine nezobrazil pole „nadradená úloha\" — na to nemáš právo v tomto projekte, takže úloha vznikne samostatne."
    setting_draft_system_prompt: "Systémový prompt pre predvyplnenie úlohy"
    setting_draft_system_prompt_info: "Persona a pravidlá pre písanie úloh — okrem iného to, že názov a popis sú VŽDY v angličtine, a podľa čoho sa vyberá tracker. Zoznamy projektov, kategórií a PM ani šablóny popisu sem NEPÍŠ: dopĺňajú sa automaticky z Redmine. {{NAME}} sa nahradí menom prihláseného užívateľa. Prázdne pole vráti pôvodný text."
    legend_code: "Kód z GitLabu"
    setting_code_enabled: "Posielať kód modelu"
    setting_code_enabled_info: "Keď je zapnuté, merge request odkázaný z úlohy sa načíta z GitLabu a jeho review komentáre aj diff idú do promptu pre návrh odpovede a zhrnutie; pri novej úlohe pribudnú nálezy z hľadania v kóde. Vypnuté = GitLab sa nevolá vôbec a žiadny kód z Redmine neodíde. Súbory, ktoré vyzerajú na tajomstvá, sa vynechávajú a hodnoty podobné heslám sa prepisujú — je to poistka, nie záruka. Zapni to len tam, kde je posielanie zdrojového kódu modelu schválená politika."
    setting_gitlab_url: "URL GitLabu"
    setting_gitlab_url_info: "Základná adresa, napr. https://gitlab.previo.info. Odkaz na merge request v úlohe sa nasleduje len vtedy, keď mieri na tento host — inak by stačilo zapísať cudziu adresu a token by odišiel tam."
    setting_gitlab_token: "GitLab token"
    setting_gitlab_token_info: "Osobný alebo projektový token so scope read_api. Len na čítanie je zámer: plugin do GitLabu nikdy nezapisuje. Ukladá sa šifrovane a do stránky sa nikdy nevypisuje."
    setting_gitlab_token_clear: "Zmazať GitLab token"
    setting_code_diff_limit: "Strop diffu (znakov)"
    setting_code_diff_limit_info: "Koľko diffu sa zmestí do jedného promptu; jeden súbor smie zabrať najviac štvrtinu. Namerané na produkčných merge requestoch: medián pár stoviek znakov, najväčší 59 000 pri 78 súboroch. Čo sa nezmestí, vypíše sa len názvom."
    setting_code_search: "Nálezov z hľadania v kóde pri novej úlohe"
    setting_code_search_info: "Na repozitár a kľúčové slovo. Nová úloha ešte nemá merge request, takže jediná cesta ku kódu je fulltextové hľadanie podľa kľúčových slov, ktoré model aj tak vyrába pre hľadanie duplicít. 0 = nehľadať. Každý nález je volanie GitLabu, takže to stojí aj čas pri zakladaní úlohy."

    legend_key: "Klucz API Gemini (wspólny dla całego Previo)"
    legend_general: "Ustawienia ogólne"
    legend_reply: "Propozycja odpowiedzi (przycisk obok pola komentarza)"
    reply_note: "Ustawienia przycisku „Propozycja odpowiedzi AI” pod polem komentarza. Zawsze uwzględniane są wszystkie publiczne komentarze oraz temat i opis zagadnienia."
    legend_summary: "Podsumowanie zagadnienia (przycisk „Podsumowanie AI”)"
    summary_note: "Ustawienia przycisku „Podsumowanie AI” na pasku akcji zagadnienia. Podsumowanie jest tylko wyświetlane w oknie nad zagadnieniem — nigdy nie jest nigdzie wstawiane."
    legend_draft: "Wstępne wypełnianie nowego zagadnienia (przycisk „Stwórz z AI”)"
    draft_note: "Ustawienia przycisku na formularzu nowego zagadnienia. Na podstawie krótkiej notatki AI uzupełnia temat, opis, typ zagadnienia, kategorię, priorytet i pola wymagane (np. Project Manager). Formularz jest tylko WSTĘPNIE WYPEŁNIANY — „Stwórz” zawsze klika człowiek. Nigdzie nie jest utrzymywana lista projektów, kategorii ani PM-ów, podobnie jak szablony opisów: są odczytywane z Redmine."

    setting_api_key: "Klucz API Gemini"
    setting_api_key_info: "Klucz ustawia wyłącznie administrator i obowiązuje on wszystkich użytkowników. Jest przechowywany w postaci zaszyfrowanej i nigdy nie trafia do przeglądarki, więc nie da się go odczytać przez Zbadaj element. Pozostaw pole puste, aby zachować obecny klucz. Klucz uzyskasz na aistudio.google.com."
    setting_api_key_clear: "Usuń klucz"
    setting_api_key_clear_info: "Zaznacz i zapisz, aby usunąć zapisany klucz."
    key_set: "Klucz jest ustawiony (%{hint})"
    key_missing: "Brak klucza — asystent AI nie będzie działał."

    setting_enabled: "Włącz asystenta AI"
    setting_enabled_info: "Wyłączenie to bezpieczne ustawienie domyślne — dopóki asystent nie zostanie włączony, nic nie jest wysyłane do Gemini."
    setting_model: "Model"
    setting_model_info: "Na przykład gemini-3.6-flash (zalecany domyślnie) lub gemini-3.5-flash-lite dla niższych kosztów."
    setting_max_tokens: "Maks. tokenów odpowiedzi"
    setting_max_tokens_info: "W modelach rozumujących limit jest dzielony między rozumowanie i odpowiedź — niska wartość może dać pustą odpowiedź. Wartości poniżej 1024 nie są zalecane."
    setting_rate_limit: "Wywołania na użytkownika na godzinę"
    setting_rate_limit_info: "0 = bez limitu. Wywołania są rozliczane na wspólny klucz, więc ten limit chroni budżet Previo."
    setting_suggest_enabled: "Włącz propozycję odpowiedzi AI"
    setting_suggest_enabled_info: "Przycisk obok Dodaj komentarz w zagadnieniu. W przeciwieństwie do pozostałych funkcji ta jest domyślnie WŁĄCZONA, ponieważ działała już, zanim pojawił się ten przełącznik — jej wyłączenie to świadoma decyzja. Wyłączenie ukrywa przycisk i blokuje także endpoint, więc nie da się go wywołać bezpośrednio. Pozostałe funkcje nie są objęte tą zmianą."
    setting_description_limit: "Maks. liczba znaków opisu"
    setting_description_limit_info: "Dotyczy tylko propozycji odpowiedzi — tam wystarczy ogólny zarys zgłoszenia. Podsumowanie ma własny limit poniżej."
    setting_changeset_limit: "Commity uwzględniane w kontekście"
    setting_changeset_limit_info: "Natywne zestawienia zmian z repozytorium zagadnienia. Pomijane, gdy projekt nie ma repozytorium."
    setting_system_prompt: "Prompt systemowy dla propozycji odpowiedzi"
    setting_system_prompt_info: "Persona, która pisze odpowiedzi w komentarzach — kim jest, jak pisze i w jakim języku. {{NAME}} jest zastępowane imieniem i nazwiskiem zalogowanego użytkownika. Puste pole przywraca tekst pierwotny."
    setting_summary_description_limit: "Maks. liczba znaków opisu dla podsumowania"
    setting_summary_description_limit_info: "W podsumowaniu to opis niesie właściwe zgłoszenie, dlatego limit jest wyższy (domyślnie 4000). 0 = bez skracania."
    setting_summary_system_prompt: "Prompt systemowy dla podsumowania"
    setting_summary_system_prompt_info: "Osobna persona, a przede wszystkim FORMA podsumowania (sekcje, długość, język) — celowo tutaj, a nie w kodzie, aby można ją było przepisać bez ingerencji we wtyczkę. {{NAME}} jest zastępowane imieniem i nazwiskiem zalogowanego użytkownika. Puste pole przywraca tekst pierwotny. Podsumowanie jest w języku, który każdy ma ustawiony w Moje konto: zastępuje go {{LANG}}. Zostaw {{LANG}} w tekście — bez niego podsumowanie powstanie w języku, który wskazuje ten prompt."
    setting_draft_enabled: "Włącz wstępne wypełnianie nowego zagadnienia"
    setting_draft_enabled_info: "Osobny przełącznik, aby tę funkcję można było wdrożyć i wyłączyć niezależnie od propozycji odpowiedzi i podsumowań. Wymaga też włączenia głównego przełącznika asystenta AI powyżej."
    setting_draft_similar_limit: "Zagadnienia sprawdzane pod kątem duplikatów"
    setting_draft_similar_limit_info: "Ile istniejących otwartych zagadnień jest przekazywanych modelowi do oceny. Wyszukiwanie obejmuje wszystkie projekty, które dana osoba widzi, a nie tylko ten z formularza — duplikat w innym projekcie to właśnie to, co warto wychwycić przed utworzeniem zagadnienia. Przy równej zgodności słów kluczowych pierwszeństwo ma projekt z formularza. Wyszukiwarka Redmine sortuje według daty, a nie trafności, więc pobierana jest większa partia, którą model układa ponownie. 0 = nie szukaj duplikatów."
    setting_draft_translate_keywords: "Tłumacz słowa kluczowe do wyszukiwania duplikatów"
    setting_draft_translate_keywords_info: "Tematy zagadnień są pisane po angielsku, ale ludzie piszą notatki we własnym języku (koledzy są w Rumunii, Polsce i na Węgrzech). Wyszukiwanie duplikatów to zwykłe LIKE po tematach, więc czeska notatka znalazła 5 zagadnień w Reservations i żadne nie było powiązane, podczas gdy ta sama notatka po angielsku osiągnęła limit 40 z trafnymi wynikami na górze. Po włączeniu tej opcji najpierw dodatkowe, niewielkie wywołanie zamienia notatkę na angielskie słowa kluczowe. Jeśli się nie powiedzie, wyszukiwanie korzysta z oryginalnego tekstu — sam szkic zagadnienia nie jest tym objęty.
      Uwaga: jedno kliknięcie oznacza wtedy do trzech płatnych wywołań (słowa kluczowe, szkic i drugi szkic, jeśli AI zmieni projekt), ale do limitu godzinowego liczy się tylko jedno. Tłumaczenie jest przechowywane w pamięci podręcznej osobno, więc ponowne kliknięcie dla tej samej notatki nie kosztuje go drugi raz."
    setting_draft_max_tokens: "Maks. tokenów szkicu zagadnienia"
    setting_draft_max_tokens_info: "Osobny, wyższy limit niż dla odpowiedzi — opis według szablonu oraz uzasadnienia duplikatów to dłuższy wynik. Zbyt niska wartość zwraca obcięty JSON i tworzenie szkicu się nie powiedzie."
    legend_plan: "Tryb planu (różdżka w nagłówku, „Tworzenie zagadnień z AI”)"
    plan_note: "Ustawienia ikony różdżki obok ikony osoby w nagłówku. Opisujesz pracę własnymi słowami i we własnym języku, AI proponuje plan — jedno zagadnienie albo zagadnienie nadrzędne z podzagadnieniami — a plan można doprecyzować w rozmowie. Po „Akceptuj” zagadnienia są wstępnie wypełniane JEDNO PO DRUGIM, a „Stwórz” dla każdego z nich klika człowiek. Kolejność wymusza Redmine: podzagadnienie potrzebuje numeru zagadnienia nadrzędnego, który istnieje dopiero po jego utworzeniu."
    button_plan: "Tworzenie zagadnień z AI"
    plan_shortcut_hint: "Tworzenie zagadnień z AI (%{keys})"
    setting_plan_enabled: "Włącz tryb planu"
    setting_plan_enabled_info: "Osobny przełącznik, aby tę funkcję można było wdrożyć i wyłączyć niezależnie od pozostałych. Wymaga też włączenia głównego przełącznika asystenta AI powyżej. Gdy jest wyłączony, ikona różdżki nie jest wyświetlana w nagłówku."
    setting_plan_max_items: "Maks. liczba zagadnień w planie"
    setting_plan_max_items_info: "Łącznie z zagadnieniem nadrzędnym. Sześć wynika z wielkości wyniku, a nie z ambicji: każda pozycja ma własny opis, a planu, którego nikt nie przeczyta, i tak nie da się użyć. Twardy limit w kodzie wynosi 12 niezależnie od tej wartości."
    setting_plan_max_tokens: "Maks. tokenów planu"
    setting_plan_max_tokens_info: "Wyższy niż limit dla pojedynczego zagadnienia — plan zawiera opis każdej pozycji. Zbyt niska wartość zwraca obcięty JSON i tworzenie planu się nie powiedzie."
    setting_plan_system_prompt: "Prompt systemowy dla trybu planu"
    setting_plan_system_prompt_info: "Zasady dzielenia pracy na zagadnienia: kiedy użyć zagadnienia nadrzędnego, a kiedy nie, że temat i opis są zawsze po angielsku, a podsumowanie planu przeciwnie — w języku zgłoszenia. NIE umieszczaj tu list projektów, kategorii ani PM-ów ani szablonów opisów — są dodawane z Redmine. {{NAME}} jest zastępowane imieniem i nazwiskiem zalogowanego użytkownika. Puste pole przywraca tekst pierwotny."
    error_plan_empty: "Najpierw opisz, co trzeba zrobić."
    plan_input_label: "Co trzeba zrobić?"
    plan_input_placeholder: "Opisz to własnymi słowami i we własnym języku. Jeśli potrzeba więcej niż jednego zagadnienia, AI zaproponuje, jak je rozplanować."
    plan_project_lock: "Zachowaj ten projekt"
    plan_submit: "Pokaż propozycję AI"
    plan_refine: "Przelicz z moimi uwagami"
    plan_reply_label: "Chcesz coś zmienić? Napisz to tutaj i kliknij Przelicz z moimi uwagami."
    plan_reply_placeholder: "np. podziel to na dwa zagadnienia, ustaw priorytet High, PM to ktoś inny…"
    plan_reset: "Resetuj"
    plan_accept: "Akceptuj"
    plan_working: "Przygotowywanie planu…"
    plan_heading: "Proponowany plan"
    plan_parent: "Zagadnienie nadrzędne"
    plan_subtask: "Podzagadnienie"
    plan_standalone: "Samodzielne zagadnienie"
    plan_no_subtasks: "W projekcie %{project} nie możesz zarządzać podzagadnieniami, więc AI zaproponuje samodzielne zagadnienia. Zalecana kolejność jest w podsumowaniu."
    error_plan_no_result: "AI nie zwróciła żadnego zagadnienia. Spróbuj dodać więcej szczegółów."
    plan_queue_progress: "Plan AI: utworzono %{done} z %{total}"
    plan_queue_next: "Następne: %{subject}"
    plan_queue_go: "Wypełnij następne zagadnienie"
    plan_queue_skip: "Pomiń"
    plan_queue_cancel: "Anuluj plan"
    plan_queue_dismiss: "Ukryj"
    plan_queue_done: "Gotowe — plan został utworzony."
    plan_queue_no_parent: "Zagadnienie nadrzędne nie zostało utworzone, więc pozostałe zagadnienia będą samodzielne."
    plan_queue_parent_missing: "Redmine nie wyświetlił pola zagadnienia nadrzędnego — nie masz do tego uprawnień w tym projekcie, więc to zagadnienie będzie samodzielne."
    setting_draft_system_prompt: "Prompt systemowy dla wstępnego wypełniania zagadnienia"
    setting_draft_system_prompt_info: "Persona i zasady pisania zagadnień — m.in. to, że temat i opis są ZAWSZE po angielsku, oraz sposób wyboru typu zagadnienia. NIE umieszczaj tu list projektów, kategorii ani PM-ów ani szablonów opisów: są dodawane automatycznie z Redmine. {{NAME}} jest zastępowane imieniem i nazwiskiem zalogowanego użytkownika. Puste pole przywraca tekst pierwotny."
    legend_code: "Kod z GitLab"
    setting_code_enabled: "Ulepszaj wyniki informacjami z GitLab"
    setting_code_enabled_info: "Po włączeniu merge request powiązany z zagadnieniem jest odczytywany z GitLab, a jego komentarze z code review i diff trafiają do promptu propozycji odpowiedzi i podsumowania; nowe zagadnienie otrzymuje wyniki wyszukiwania w kodzie. Wyłączenie oznacza, że GitLab nigdy nie jest wywoływany i żaden kod nie opuszcza Redmine. Pliki wyglądające na zawierające sekrety są pomijane, a wartości przypominające dane uwierzytelniające są maskowane, ale to zabezpieczenie, nie gwarancja — włączaj tę opcję tylko tam, gdzie wysyłanie kodu źródłowego do modelu jest zaakceptowaną polityką."
    setting_gitlab_url: "URL GitLab"
    setting_gitlab_url_info: "Adres bazowy, np. https://gitlab.previo.info. Link do merge requesta w zagadnieniu jest otwierany tylko wtedy, gdy wskazuje na ten host — w przeciwnym razie każdy mógłby wysłać token gdzie indziej."
    setting_gitlab_token: "Token GitLab"
    setting_gitlab_token_info: "Osobisty lub projektowy token dostępu z zakresem read_api. Tylko odczyt jest celowy: wtyczka nigdy nie zapisuje do GitLab. Przechowywany w postaci zaszyfrowanej i nigdy nie wyświetlany z powrotem na stronie."
    setting_gitlab_token_clear: "Usuń token GitLab"
    setting_code_diff_limit: "Limit diffu (znaki)"
    setting_code_diff_limit_info: "Górny limit diffu w jednym prompcie; pojedynczy plik może zająć najwyżej jedną czwartą. Zmierzone na produkcyjnych merge requestach: mediana kilkaset znaków, największy 59 000 w 78 plikach. To, co się nie zmieści, jest wymieniane tylko z nazwy pliku."
    setting_code_search: "Wyniki wyszukiwania w kodzie dla nowego zagadnienia"
    setting_code_search_info: "Na repozytorium i słowo kluczowe. Nowe zagadnienie nie ma jeszcze merge requesta, więc jedynym sposobem dotarcia do kodu jest wyszukiwanie pełnotekstowe według słów kluczowych, które model i tak generuje do wykrywania duplikatów. 0 wyłącza wyszukiwanie. Każdy wynik to jedno wywołanie GitLab, więc kosztuje to również czas przy tworzeniu zagadnienia."

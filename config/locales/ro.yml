    error_disabled: "Asistentul AI este dezactivat din administrare."
    error_no_key: "Administratorul nu a setat încă o cheie API Gemini."
    error_invalid_key: "Gemini a respins cheia API — cereți unui administrator să o verifice în configurarea pluginului."
    error_unavailable: "Asistentul AI nu este disponibil pentru acest tichet."
    error_rate_limited: "Ați atins limita orară de apeluri AI. Încercați din nou mai târziu."
    error_provider_rate_limited: "Gemini raportează o limită de rată sau o cotă epuizată. Încercați din nou în curând."
    error_blocked: "Gemini a blocat cererea prin filtrele sale de siguranță."
    error_truncated: "Răspunsul nu a încăput în limita de tokeni — cereți unui administrator să mărească „Max. tokeni pentru răspuns”."
    error_timeout: "Gemini nu a răspuns la timp."
    error_unreachable: "Gemini nu a putut fi contactat — verificați conexiunea la rețea."
    error_generic: "Apelul AI a eșuat; detaliile sunt în jurnalul serverului."
    error_draft_empty: "Completați mai întâi un subiect sau o descriere — AI-ul are nevoie de un punct de plecare."
    error_invalid_json: "AI-ul a returnat un format neașteptat. Încercați din nou."

    legend_key: "Cheie API Gemini (comună pentru tot Previo)"
    legend_general: "Setări generale"
    legend_reply: "Sugestie de răspuns (butonul de lângă câmpul de comentariu)"
    reply_note: "Setări pentru butonul „Sugestie de răspuns AI” de sub câmpul de comentariu. Toate comentariile publice, precum și subiectul și descrierea tichetului, sunt incluse întotdeauna."
    legend_summary: "Rezumatul tichetului (butonul „Rezumat AI”)"
    summary_note: "Setări pentru butonul „Rezumat AI” din bara de acțiuni a tichetului. Rezumatul este doar afișat într-o fereastră deasupra tichetului — nu este inserat nicăieri."
    legend_draft: "Precompletarea tichetului nou (butonul „Creează cu AI”)"
    draft_note: "Setări pentru butonul din formularul de tichet nou. Pornind de la o notă scurtă, AI-ul completează subiectul, descrierea, tipul de tichet, categoria, prioritatea și câmpurile obligatorii (de ex. Project Manager). Formularul este doar PRECOMPLETAT — pe „Creează” apasă întotdeauna un om. Nicio listă de proiecte, categorii sau PM-i nu este întreținută nicăieri și nici șabloanele de descriere: acestea sunt citite din Redmine."

    setting_api_key: "Cheie API Gemini"
    setting_api_key_info: "Doar un administrator setează această cheie și ea se aplică tuturor utilizatorilor. Este stocată criptat și nu este trimisă niciodată către browser, deci nu poate fi citită prin Inspect element. Lăsați câmpul gol pentru a păstra cheia existentă. Obțineți o cheie pe aistudio.google.com."
    setting_api_key_clear: "Elimină cheia"
    setting_api_key_clear_info: "Bifați și salvați pentru a șterge cheia stocată."
    key_set: "Cheia este setată (%{hint})"
    key_missing: "Nu este setată nicio cheie — asistentul AI nu va funcționa."

    setting_enabled: "Activează asistentul AI"
    setting_enabled_info: "Dezactivat este valoarea implicită sigură — nimic nu este trimis către Gemini până când nu activați această opțiune."
    setting_model: "Model"
    setting_model_info: "De exemplu gemini-3.6-flash (valoarea implicită recomandată) sau gemini-3.5-flash-lite pentru costuri mai mici."
    setting_max_tokens: "Max. tokeni pentru răspuns"
    setting_max_tokens_info: "La modelele cu raționament, limita este împărțită între gândire și răspuns — o valoare mică poate produce un răspuns gol. Nu se recomandă sub 1024."
    setting_rate_limit: "Apeluri per utilizator pe oră"
    setting_rate_limit_info: "0 = nelimitat. Apelurile sunt facturate pe cheia comună, deci această limită protejează bugetul Previo."
    setting_suggest_enabled: "Activează sugestia de răspuns AI"
    setting_suggest_enabled_info: "Butonul de lângă Adaugă comentariu dintr-un tichet. Spre deosebire de celelalte funcții, aceasta este ACTIVATĂ implicit, deoarece funcționa deja înainte să existe acest comutator — dezactivarea ei este un act deliberat. Dezactivarea ascunde butonul și refuză și endpointul, astfel încât acesta nu poate fi apelat direct. Celelalte funcții nu sunt afectate."
    setting_description_limit: "Max. caractere din descriere"
    setting_description_limit_info: "Se aplică doar sugestiei de răspuns — acolo esența cererii este suficientă. Rezumatul are propria limită, mai jos."
    setting_changeset_limit: "Commit-uri incluse în context"
    setting_changeset_limit_info: "Schimbările native din depozitul tichetului. Se omit dacă proiectul nu are niciun depozit."
    setting_system_prompt: "Prompt de sistem pentru sugestia de răspuns"
    setting_system_prompt_info: "Persona care scrie răspunsurile la comentarii — cine este, cum scrie și în ce limbă. {{NAME}} este înlocuit cu numele utilizatorului autentificat. Un câmp gol restabilește textul original."
    setting_summary_description_limit: "Max. caractere din descriere pentru rezumat"
    setting_summary_description_limit_info: "Pentru rezumat, descrierea conține cererea propriu-zisă, așa că limita este mai mare (implicit 4000). 0 = fără nicio trunchiere."
    setting_summary_system_prompt: "Prompt de sistem pentru rezumat"
    setting_summary_system_prompt_info: "O persona separată și, mai ales, FORMA rezumatului (secțiuni, lungime, limbă) — intenționat aici și nu în cod, ca să poată fi rescrisă fără a modifica pluginul. {{NAME}} este înlocuit cu numele utilizatorului autentificat. Un câmp gol restabilește textul original. Rezumatul urmează limba pe care fiecare persoană o are setată în Contul meu: {{LANG}} este înlocuit cu aceasta. Păstrați {{LANG}} în text — fără el, rezumatul iese în limba menționată în acest prompt."
    setting_draft_enabled: "Activează precompletarea tichetului nou"
    setting_draft_enabled_info: "Un comutator separat, astfel încât această funcție să poată fi lansată și dezactivată independent de sugestiile de răspuns și de rezumate. Necesită și comutatorul principal al asistentului AI de mai sus."
    setting_draft_similar_limit: "Tichete verificate pentru duplicate"
    setting_draft_similar_limit_info: "Câte tichete deschise existente sunt oferite modelului spre analiză. Căutarea acoperă toate proiectele pe care persoana le poate vedea, nu doar pe cel din formular — un duplicat într-un alt proiect este exact ce merită prins înainte de crearea tichetului. La potriviri egale de cuvinte cheie, proiectul din formular are prioritate. Căutarea din Redmine sortează după dată, nu după relevanță, așa că se ia un lot mai mare, iar modelul îl reordonează. 0 = nu se caută duplicate."
    setting_draft_translate_keywords: "Tradu cuvintele cheie pentru căutarea duplicatelor"
    setting_draft_translate_keywords_info: "Subiectele tichetelor sunt scrise în engleză, dar oamenii își scriu nota în propria limbă (colegii sunt în România, Polonia și Ungaria). Căutarea duplicatelor este un simplu LIKE pe subiecte, așa că o notă în cehă a găsit 5 tichete în Reservations și niciunul nu era relevant, în timp ce aceeași notă în engleză a atins plafonul de 40, cu potrivirile relevante în frunte. Cu această opțiune activată, un mic apel suplimentar transformă mai întâi nota în cuvinte cheie în engleză. Dacă eșuează, căutarea revine la formularea originală — draftul în sine nu este niciodată afectat.
      Notă: un clic înseamnă atunci până la trei apeluri plătite (cuvinte cheie, draft și un al doilea draft dacă AI-ul schimbă proiectul), dar doar unul se contorizează în limita orară. Traducerea este păstrată separat în cache, așa că un nou clic pe aceeași notă nu o plătește de două ori."
    setting_draft_max_tokens: "Max. tokeni pentru draftul de tichet"
    setting_draft_max_tokens_info: "O limită separată, mai mare decât pentru răspunsuri — o descriere după șablon plus motivele pentru duplicate înseamnă un rezultat mai lung. O valoare prea mică returnează un JSON trunchiat, iar draftul eșuează."
    legend_plan: "Modul plan (bagheta din antet, „Creator AI de tichete”)"
    plan_note: "Setări pentru pictograma baghetă de lângă pictograma de persoană din antet. Descrieți munca în propriile cuvinte și în propria limbă, AI-ul propune un plan — un tichet sau un tichet părinte cu subtichete — iar planul poate fi rafinat prin conversație. După „Acceptă”, tichetele sunt precompletate UNUL CÂTE UNUL și un om apasă „Creează” pentru fiecare. Ordinea este impusă de Redmine: un subtichet are nevoie de ID-ul tichetului părinte, care există doar după ce părintele a fost creat."
    button_plan: "Creator AI de tichete"
    plan_shortcut_hint: "Creator AI de tichete (%{keys})"
    setting_plan_enabled: "Activează modul plan"
    setting_plan_enabled_info: "Un comutator separat, astfel încât această funcție să poată fi lansată și dezactivată independent de celelalte. Necesită și comutatorul principal al asistentului AI de mai sus. Cât timp este dezactivat, pictograma baghetă nu apare în antet."
    setting_plan_max_items: "Max. tichete per plan"
    setting_plan_max_items_info: "Inclusiv tichetul părinte. Șase este ales în funcție de rezultat, nu din ambiție: fiecare element are propria descriere, iar un plan pe care nu îl citește nimeni până la capăt este oricum inutil. Plafonul fix din cod este 12, indiferent de această valoare."
    setting_plan_max_tokens: "Max. tokeni pentru plan"
    setting_plan_max_tokens_info: "Mai mare decât limita pentru un singur tichet — un plan conține o descriere pentru fiecare element. O valoare prea mică returnează un JSON trunchiat, iar planul eșuează."
    setting_plan_system_prompt: "Prompt de sistem pentru modul plan"
    setting_plan_system_prompt_info: "Reguli pentru împărțirea muncii în tichete: când se folosește un tichet părinte și când nu, faptul că subiectul și descrierea sunt întotdeauna în engleză, iar rezumatul planului este, în schimb, în limba cererii. NU puneți aici liste de proiecte, categorii sau PM-i ori șabloane de descriere — acestea sunt adăugate din Redmine. {{NAME}} este înlocuit cu numele utilizatorului autentificat. Un câmp gol restabilește textul original."
    error_plan_empty: "Descrieți mai întâi ce trebuie făcut."
    plan_input_label: "Ce trebuie făcut?"
    plan_input_placeholder: "Descrieți în propriile cuvinte și în propria limbă. Dacă este nevoie de mai multe tichete, AI-ul va propune cum să fie organizate."
    plan_project_lock: "Păstrează acest proiect"
    plan_submit: "Vezi sugestia AI"
    plan_refine: "Recalculează cu notele mele"
    plan_reply_label: "Doriți altceva? Scrieți aici și faceți clic pe Recalculează cu notele mele."
    plan_reply_placeholder: "de ex. împarte în două tichete, setează prioritatea High, PM-ul este altcineva…"
    plan_reset: "Resetează"
    plan_accept: "Acceptă"
    plan_working: "Se pregătește planul…"
    plan_heading: "Plan propus"
    plan_parent: "Tichet părinte"
    plan_subtask: "Subtichet"
    plan_standalone: "Tichet independent"
    plan_no_subtasks: "Nu puteți gestiona subtichete în %{project}, așa că AI-ul va propune tichete independente. Ordinea recomandată este în rezumat."
    error_plan_no_result: "AI-ul nu a returnat niciun tichet. Încercați să adăugați mai multe detalii."
    plan_queue_progress: "Plan AI: %{done} din %{total} create"
    plan_queue_next: "Următorul: %{subject}"
    plan_queue_go: "Precompletează următorul tichet"
    plan_queue_skip: "Sari peste"
    plan_queue_cancel: "Anulează planul"
    plan_queue_dismiss: "Ascunde"
    plan_queue_done: "Gata — planul a fost creat."
    plan_queue_no_parent: "Tichetul părinte nu a fost creat, așa că tichetele rămase vor fi independente."
    plan_queue_parent_missing: "Redmine nu a afișat câmpul pentru tichetul părinte — nu aveți permisiunea necesară în acest proiect, așa că acest tichet va fi independent."
    setting_draft_system_prompt: "Prompt de sistem pentru precompletarea tichetului"
    setting_draft_system_prompt_info: "Persona și regulile pentru scrierea tichetelor — printre ele, faptul că subiectul și descrierea sunt ÎNTOTDEAUNA în engleză și cum se alege tipul de tichet. NU puneți aici liste de proiecte, categorii sau PM-i și nici șabloanele de descriere: acestea sunt adăugate automat din Redmine. {{NAME}} este înlocuit cu numele utilizatorului autentificat. Un câmp gol restabilește textul original."
    legend_code: "Cod din GitLab"
    setting_code_enabled: "Îmbunătățește rezultatele cu informații din GitLab"
    setting_code_enabled_info: "Când este activat, merge request-ul legat din tichet este citit din GitLab, iar comentariile sale de review și diff-ul intră în promptul pentru sugestia de răspuns și pentru rezumat; un tichet nou primește rezultate din căutarea în cod. Dezactivat înseamnă că GitLab nu este apelat niciodată și niciun cod nu părăsește Redmine. Fișierele care par să conțină secrete sunt omise, iar valorile care seamănă cu date de autentificare sunt mascate, dar aceasta este o plasă de siguranță, nu o garanție — activați opțiunea doar acolo unde trimiterea codului sursă către model este o politică acceptată."
    setting_gitlab_url: "URL GitLab"
    setting_gitlab_url_info: "Adresa de bază, de ex. https://gitlab.previo.info. Un link către un merge request dintr-un tichet este urmat doar dacă indică spre acest host — altfel oricine ar putea trimite tokenul în altă parte."
    setting_gitlab_token: "Token GitLab"
    setting_gitlab_token_info: "Token de acces personal sau de proiect cu scope-ul read_api. Accesul doar pentru citire este intenționat: pluginul nu scrie niciodată în GitLab. Stocat criptat și niciodată afișat înapoi în pagină."
    setting_gitlab_token_clear: "Șterge tokenul GitLab"
    setting_code_diff_limit: "Limita diff-ului (caractere)"
    setting_code_diff_limit_info: "Plafonul pentru diff într-un singur prompt; un singur fișier poate ocupa cel mult un sfert din el. Măsurat pe merge request-uri din producție: mediana câteva sute de caractere, cel mai mare 59.000 în 78 de fișiere. Tot ce nu încape este listat doar după numele fișierului."
    setting_code_search: "Rezultate din căutarea în cod pentru un tichet nou"
    setting_code_search_info: "Per depozit și cuvânt cheie. Un tichet nou nu are încă un merge request, așa că singura cale către cod este o căutare full-text după cuvintele cheie pe care modelul le produce oricum pentru detectarea duplicatelor. 0 dezactivează căutarea. Fiecare rezultat înseamnă un apel GitLab, deci costă și timp la crearea unui tichet."

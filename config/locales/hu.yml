    legend_key: "Gemini API kulcs (közös az egész Previóban)"
    legend_general: "Általános beállítások"
    legend_reply: "Válaszjavaslat (gomb a megjegyzésmező mellett)"
    reply_note: "A megjegyzésmező alatti „AI válaszjavaslat” gomb beállításai. Az összes nyilvános megjegyzés, valamint a feladat tárgya és leírása mindig bekerül."
    legend_summary: "Feladat-összefoglaló (az „AI összefoglaló” gomb)"
    summary_note: "A feladat műveletsávjában lévő „AI összefoglaló” gomb beállításai. Az összefoglaló csak egy ablakban jelenik meg a feladat fölött — sehová nem kerül beillesztésre."
    legend_draft: "Új feladat előzetes kitöltése (a „Létrehozás AI-jal” gomb)"
    draft_note: "Az új feladat űrlapján lévő gomb beállításai. Egy rövid jegyzetből az AI kitölti a tárgyat, a leírást, a feladat típust, a kategóriát, a prioritást és a kötelező mezőket (pl. Project Manager). Az űrlap csak ELŐRE KITÖLTŐDIK — a „Létrehoz” gombra mindig ember kattint. A projektek, kategóriák és PM-ek listáját sehol sem kell karbantartani, ahogy a leírássablonokat sem: ezek a Redmine-ból kerülnek kiolvasásra."

    setting_api_key: "Gemini API kulcs"
    setting_api_key_info: "Ezt a kulcsot csak adminisztrátor állíthatja be, és minden felhasználóra érvényes. Titkosítva tárolódik, és soha nem kerül a böngészőbe, így az Inspect element funkcióval sem olvasható ki. Hagyja üresen a mezőt, ha meg szeretné tartani a meglévő kulcsot. Kulcsot az aistudio.google.com oldalon kaphat."
    setting_api_key_clear: "Kulcs eltávolítása"
    setting_api_key_clear_info: "Jelölje be és mentse a tárolt kulcs törléséhez."
    key_set: "A kulcs be van állítva (%{hint})"
    key_missing: "Nincs kulcs beállítva — az AI asszisztens nem fog működni."

    setting_enabled: "AI asszisztens engedélyezése"
    setting_enabled_info: "A kikapcsolt állapot a biztonságos alapértelmezés — amíg ez nincs bekapcsolva, semmi sem kerül elküldésre a Gemininek."
    setting_model: "Modell"
    setting_model_info: "Például gemini-3.6-flash (ajánlott alapértelmezés) vagy gemini-3.5-flash-lite az alacsonyabb költség érdekében."
    setting_max_tokens: "Válasz max. tokenszáma"
    setting_max_tokens_info: "Gondolkodó (reasoning) modelleknél a korlát a gondolkodás és a válasz között oszlik meg — alacsony érték üres választ eredményezhet. 1024 alatt nem ajánlott."
    setting_rate_limit: "Hívások felhasználónként óránként"
    setting_rate_limit_info: "0 = korlátlan. A hívások költsége a közös kulcsot terheli, így ez a korlát a Previo költségkeretét védi."
    setting_suggest_enabled: "AI válaszjavaslat engedélyezése"
    setting_suggest_enabled_info: "A feladatnál a Megjegyzés hozzáadása melletti gomb. A többi funkcióval ellentétben ez alapértelmezetten BE van kapcsolva, mert már a kapcsoló megjelenése előtt is működött — kikapcsolása tudatos lépés. Kikapcsolva a gomb eltűnik, és a végpont is elutasítja a kéréseket, így közvetlenül sem hívható. A többi funkciót ez nem érinti."
    setting_description_limit: "Leírás max. karakterszáma"
    setting_description_limit_info: "Csak a válaszjavaslatra vonatkozik — ott elég a kérés lényege. Az összefoglalónak lent saját korlátja van."
    setting_changeset_limit: "Kontextusba vett commitok száma"
    setting_changeset_limit_info: "Natív changesetek a feladathoz tartozó tárolóból. Kimarad, ha a projektnek nincs tárolója."
    setting_system_prompt: "Rendszerprompt a válaszjavaslathoz"
    setting_system_prompt_info: "A megjegyzésekre választ író persona — ki ő, hogyan ír és milyen nyelven. A {{NAME}} helyére a bejelentkezett felhasználó neve kerül. Üres mező esetén az eredeti szöveg áll vissza."
    setting_summary_description_limit: "Leírás max. karakterszáma az összefoglalóhoz"
    setting_summary_description_limit_info: "Az összefoglalónál a leírás hordozza a tényleges kérést, ezért a korlát magasabb (alapértelmezés: 4000). 0 = nincs csonkolás."
    setting_summary_system_prompt: "Rendszerprompt az összefoglalóhoz"
    setting_summary_system_prompt_info: "Külön persona, és mindenekelőtt az összefoglaló FORMÁJA (szakaszok, hossz, nyelv) — szándékosan itt, nem a kódban, hogy a plugin módosítása nélkül átírható legyen. A {{NAME}} helyére a bejelentkezett felhasználó neve kerül. Üres mező esetén az eredeti szöveg áll vissza. Az összefoglaló azt a nyelvet követi, amelyet az adott személy a Fiókom adatai oldalon beállított: a {{LANG}} helyére ez kerül. Hagyja a {{LANG}} jelölőt a szövegben — nélküle az összefoglaló azon a nyelven készül, amelyet ez a prompt megnevez."
    setting_draft_enabled: "Új feladat előzetes kitöltésének engedélyezése"
    setting_draft_enabled_info: "Külön kapcsoló, hogy ez a funkció a válaszjavaslattól és az összefoglalótól függetlenül bevezethető és kikapcsolható legyen. A fenti fő AI asszisztens kapcsolónak is bekapcsolva kell lennie."
    setting_draft_similar_limit: "Duplikátumként vizsgált feladatok"
    setting_draft_similar_limit_info: "Hány meglévő nyitott feladatot kap meg a modell áttekintésre. A keresés minden olyan projektre kiterjed, amelyet az adott személy lát, nem csak az űrlapon szereplőre — egy másik projektben lévő duplikátumot éppen érdemes kiszűrni, mielőtt a feladat létrejön. Azonos kulcsszóegyezésnél az űrlap projektje kerül előre. A Redmine keresője dátum, nem relevancia szerint rendez, ezért nagyobb adag kerül lekérésre, és a modell rendezi újra. 0 = nincs duplikátumkeresés."
    setting_draft_translate_keywords: "Kulcsszavak fordítása a duplikátumkereséshez"
    setting_draft_translate_keywords_info: "A feladatok tárgya angolul van megírva, de mindenki a saját nyelvén írja a jegyzetét (a kollégák Romániában, Lengyelországban és Magyarországon dolgoznak). A duplikátumkeresés egyszerű LIKE a tárgyakon, így egy cseh jegyzet 5 feladatot talált a Reservations projektben, és egyik sem kapcsolódott hozzá, míg ugyanez a jegyzet angolul elérte a 40-es felső határt, a releváns találatokkal az élen. Bekapcsolva először egy kis extra hívás angol kulcsszavakká alakítja a jegyzetet. Ha ez sikertelen, a keresés az eredeti szöveggel fut — magát a vázlatot ez soha nem érinti.
      Megjegyzés: egy kattintás így legfeljebb három fizetős hívást jelent (kulcsszavak, vázlat és egy második vázlat, ha az AI projektet vált), de az óránkénti korlátba csak egy számít bele. A fordítás külön gyorsítótárba kerül, így ha ugyanarra a jegyzetre ismét rákattint, nem kell kétszer fizetni érte."
    setting_draft_max_tokens: "Feladatvázlat max. tokenszáma"
    setting_draft_max_tokens_info: "Külön, a válaszokénál magasabb korlát — a sablon szerinti leírás és a duplikátumok indoklása hosszabb kimenet. Túl alacsony érték esetén csonkolt JSON érkezik, és a vázlat sikertelen lesz."
    legend_plan: "Tervező mód (varázspálca a fejlécben, „AI feladatlétrehozó”)"
    plan_note: "A fejlécben a személy ikon melletti varázspálca ikon beállításai. A munkát a saját szavaival és a saját nyelvén írja le, az AI pedig tervet javasol — egyetlen feladatot, vagy egy szülő feladatot alfeladatokkal —, a terv pedig beszélgetésben finomítható. Az „Elfogadás” után a feladatok EGYENKÉNT töltődnek ki előre, és mindegyiknél ember kattint a „Létrehoz” gombra. A sorrendet a Redmine kényszeríti ki: az alfeladatnak szüksége van a szülő feladat azonosítójára, amely csak a szülő létrehozása után létezik."
    button_plan: "AI feladatlétrehozó"
    plan_shortcut_hint: "AI feladatlétrehozó (%{keys})"
    setting_plan_enabled: "Tervező mód engedélyezése"
    setting_plan_enabled_info: "Külön kapcsoló, hogy ez a funkció a többitől függetlenül bevezethető és kikapcsolható legyen. A fenti fő AI asszisztens kapcsolónak is bekapcsolva kell lennie. Amíg ki van kapcsolva, a varázspálca ikon nem jelenik meg a fejlécben."
    setting_plan_max_items: "Feladatok max. száma tervenként"
    setting_plan_max_items_info: "A szülő feladattal együtt. A hatos érték a kimenetből adódik, nem nagyratörő tervekből: minden elem saját leírást kap, és egy olyan terv, amelyet senki sem olvas végig, amúgy is haszontalan. A kódban rögzített felső határ ettől az értéktől függetlenül 12."
    setting_plan_max_tokens: "Terv max. tokenszáma"
    setting_plan_max_tokens_info: "Magasabb, mint egyetlen feladat korlátja — a terv minden elemhez leírást tartalmaz. Túl alacsony érték esetén csonkolt JSON érkezik, és a terv sikertelen lesz."
    setting_plan_system_prompt: "Rendszerprompt a tervező módhoz"
    setting_plan_system_prompt_info: "A munka feladatokra bontásának szabályai: mikor kell szülő feladatot használni és mikor nem, hogy a tárgy és a leírás mindig angol, a terv összefoglalója viszont a kérés nyelvén készül. NE írjon ide projekt-, kategória- vagy PM-listákat, se leírássablonokat — ezek a Redmine-ból kerülnek hozzá. A {{NAME}} helyére a bejelentkezett felhasználó neve kerül. Üres mező esetén az eredeti szöveg áll vissza."
    error_plan_empty: "Előbb írja le, mit kell elvégezni."
    plan_input_label: "Mit kell elvégezni?"
    plan_input_placeholder: "Írja le a saját szavaival és a saját nyelvén. Ha több feladatra van szükség, az AI javaslatot tesz a felosztásukra."
    plan_project_lock: "Projekt megtartása"
    plan_submit: "AI javaslat megtekintése"
    plan_refine: "Újraszámolás a megjegyzéseimmel"
    plan_reply_label: "Valamit másképp szeretne? Írja ide, és kattintson az Újraszámolás a megjegyzéseimmel gombra."
    plan_reply_placeholder: "pl. bontsa két feladatra, a prioritás legyen High, a PM valaki más…"
    plan_reset: "Visszaállítás"
    plan_accept: "Elfogadás"
    plan_working: "Terv készítése…"
    plan_heading: "Javasolt terv"
    plan_parent: "Szülő feladat"
    plan_subtask: "Alfeladat"
    plan_standalone: "Önálló feladat"
    plan_no_subtasks: "Ebben a projektben (%{project}) nem kezelhet alfeladatokat, ezért az AI önálló feladatokat javasol. Az ajánlott sorrend az összefoglalóban található."
    error_plan_no_result: "Az AI nem adott vissza feladatot. Próbáljon több részletet megadni."
    plan_queue_progress: "AI terv: %{done} / %{total} létrehozva"
    plan_queue_next: "Következő: %{subject}"
    plan_queue_go: "Következő feladat kitöltése"
    plan_queue_skip: "Kihagyás"
    plan_queue_cancel: "Terv megszakítása"
    plan_queue_dismiss: "Elrejtés"
    plan_queue_done: "Kész — a terv létrejött."
    plan_queue_no_parent: "A szülő feladat nem jött létre, így a további feladatok önállóak lesznek."
    plan_queue_parent_missing: "A Redmine nem jelenítette meg a Szülő feladat mezőt — ebben a projektben nincs hozzá jogosultsága, így ez a feladat önálló lesz."
    setting_draft_system_prompt: "Rendszerprompt a feladat előzetes kitöltéséhez"
    setting_draft_system_prompt_info: "A persona és a feladatírás szabályai — többek között az, hogy a tárgy és a leírás MINDIG angol, és hogy mi alapján történik a feladat típus kiválasztása. NE írjon ide projekt-, kategória- vagy PM-listákat, se leírássablonokat: ezek automatikusan a Redmine-ból kerülnek hozzá. A {{NAME}} helyére a bejelentkezett felhasználó neve kerül. Üres mező esetén az eredeti szöveg áll vissza."
    legend_code: "Kód a GitLabből"
    setting_code_enabled: "Eredmények javítása GitLab-információkkal"
    setting_code_enabled_info: "Bekapcsolva a feladatból hivatkozott merge request beolvasásra kerül a GitLabből, és annak review-megjegyzései és diffje bekerülnek a válaszjavaslat és az összefoglaló promptjába; új feladatnál kódkeresési találatok kerülnek bele. Kikapcsolva a GitLab egyáltalán nem kerül meghívásra, és semmilyen kód nem hagyja el a Redmine-t. A titkokat tartalmazónak tűnő fájlok kimaradnak, a hitelesítő adatnak tűnő értékek pedig maszkolásra kerülnek, de ez csak biztonsági háló, nem garancia — csak ott kapcsolja be, ahol a forráskód modellnek való elküldése elfogadott szabály."
    setting_gitlab_url: "GitLab URL"
    setting_gitlab_url_info: "Alapcím, pl. https://gitlab.previo.info. A feladatban lévő merge request hivatkozást a rendszer csak akkor követi, ha erre a hosztra mutat — különben bárki máshová irányíthatná a tokent."
    setting_gitlab_token: "GitLab token"
    setting_gitlab_token_info: "Személyes vagy projekt hozzáférési token read_api hatókörrel. A csak olvasási jog szándékos: a plugin soha nem ír a GitLabbe. Titkosítva tárolódik, és soha nem jelenik meg újra az oldalon."
    setting_gitlab_token_clear: "GitLab token törlése"
    setting_code_diff_limit: "Diff korlátja (karakter)"
    setting_code_diff_limit_info: "A diff felső határa egy promptban; egyetlen fájl legfeljebb ennek negyedét foglalhatja el. Éles merge requesteken mérve: a medián néhány száz karakter, a legnagyobb 59 000, 78 fájlban. Ami nem fér bele, csak a fájlnevével szerepel."
    setting_code_search: "Kódkeresési találatok új feladatnál"
    setting_code_search_info: "Tárolónként és kulcsszavanként. Egy új feladatnak még nincs merge requestje, így a kódhoz csak teljes szöveges kereséssel lehet eljutni, azokkal a kulcsszavakkal, amelyeket a modell a duplikátumkereséshez amúgy is előállít. 0 kikapcsolja a keresést. Minden találat egy GitLab-hívás, így ez a feladat létrehozásakor időbe is kerül."
